<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Strava GPX files in Israel due to GPS disruption (with Map)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="title">Fix Strava GPX files in Israel due to GPS disruption</div>    

    <div id="drop-zone">
        <p>Drag and drop/Upload your disrupted GPX file here</p>
        <input type="file" id="fileElem" accept=".gpx" onchange="handleFile(this.files[0])">
    </div>
    
    <div id="result"></div>

    <div id="result_link">
        <a id="download" style="display: none;">Download Processed GPX file</a>
    </div>
    
    <div id="map-container">
        <div id="map-before" class="map"></div>
        <div id="map-after" class="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="israel-boundary.js"></script>
    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('fileElem');
        const resultDiv = document.getElementById('result');
        const downloadLink = document.getElementById('download');
        const israelBorderPolygon = window.ISRAEL_BORDER_POLYGON || [];
        const israelBorderBounds = getFlatPolygonBounds(israelBorderPolygon);
        let mapBefore, mapAfter;
        let filename;

        // Initialize maps
        function initMaps() {
            mapBefore = L.map('map-before').setView([31.4, 35], 7);
            mapAfter = L.map('map-after').setView([31.4, 35], 7);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(mapBefore);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(mapAfter);
        }

        initMaps();

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', handleDrop, false);
        
        function handleDrop(e) {
            e.preventDefault();
            dropZone.classList.remove('dragover');

            const file = e.dataTransfer.files[0];
            handleFile(file);
        }

        function handleFile(file) {
            if (file && file.name.toLowerCase().endsWith('.gpx')) {
                // remember file name without extension
                filename = file.name.substring(0, file.name.length-4);
                const reader = new FileReader();
                reader.onload = (event) => {
                    const gpxContent = event.target.result;
                    processGPX(gpxContent);
                };
                reader.readAsText(file);
            } else {
                resultDiv.textContent = 'Please drop/upload a valid GPX file.';
            }
        }

        function processGPX(gpxContent) {
            const parser = new DOMParser();
            const gpxDoc = parser.parseFromString(gpxContent, 'text/xml');

            if (gpxDoc.getElementsByTagName('parsererror').length) {
                resultDiv.textContent = 'Could not parse this GPX file.';
                downloadLink.style.display = 'none';
                return;
            }

            if (!israelBorderPolygon.length) {
                resultDiv.textContent = 'Israel boundary data is missing.';
                downloadLink.style.display = 'none';
                return;
            }

            // Process and display original route
            const originalPoints = extractPoints(gpxDoc);
            displayRoute(mapBefore, originalPoints, 'blue');

            const result = removeOutOfIsraelPoints(gpxDoc);
            const processedPoints = extractPoints(gpxDoc);

            // Display processed route
            displayRoute(mapAfter, processedPoints, 'red');

            // Generate result message
            resultDiv.textContent = `Processed GPX file with ${result.totalPoints} location points. Removed ${result.removedPoints} points.`;

            // Create download link for processed GPX
            const processedGpxContent = new XMLSerializer().serializeToString(gpxDoc);
            const blob = new Blob([processedGpxContent], {type: 'application/gpx+xml'});
            const url = URL.createObjectURL(blob);
            downloadLink.href = url;
            downloadLink.download = filename + '_fixed.gpx';
            downloadLink.style.display = 'block';
            downloadLink.textContent = 'Download Processed GPX';
        }

        function extractPoints(gpxDoc) {
            const points = [];
            const trackpoints = gpxDoc.getElementsByTagName('trkpt');
            for (let trkpt of trackpoints) {
                const lat = parseFloat(trkpt.getAttribute('lat'));
                const lon = parseFloat(trkpt.getAttribute('lon'));
                points.push([lat, lon]);
            }
            return points;
        }

        function displayRoute(map, points, color) {
            map.eachLayer((layer) => {
                if (layer instanceof L.Polyline) {
                    map.removeLayer(layer);
                }
            });

            if (!points.length) {
                map.setView([31.4, 35], 7);
                return;
            }
            
            const polyline = L.polyline(points, {color: color}).addTo(map);
            map.fitBounds(polyline.getBounds());
        }

        function removeOutOfIsraelPoints(gpxDoc) {
            const locationNodes = [
                ...gpxDoc.getElementsByTagName('trkpt'),
                ...gpxDoc.getElementsByTagName('rtept'),
                ...gpxDoc.getElementsByTagName('wpt')
            ];
            let removedPoints = 0;

            locationNodes.forEach((point) => {
                const lat = parseFloat(point.getAttribute('lat'));
                const lon = parseFloat(point.getAttribute('lon'));

                if (!isInIsrael(lat, lon)) {
                    point.parentNode.removeChild(point);
                    removedPoints++;
                }
            });

            return {
                totalPoints: locationNodes.length,
                removedPoints
            };
        }

        function isInIsrael(lat, lon) {
            if (!Number.isFinite(lat) || !Number.isFinite(lon)) return false;

            if (lat < israelBorderBounds.minLat || lat > israelBorderBounds.maxLat ||
                lon < israelBorderBounds.minLon || lon > israelBorderBounds.maxLon) {
                return false;
            }

            return isPointInFlatPolygon(lat, lon, israelBorderPolygon);
        }

        function getFlatPolygonBounds(polygon) {
            const bounds = {
                minLat: Infinity,
                maxLat: -Infinity,
                minLon: Infinity,
                maxLon: -Infinity
            };

            for (let i = 0; i < polygon.length; i += 2) {
                const lat = polygon[i];
                const lon = polygon[i + 1];
                bounds.minLat = Math.min(bounds.minLat, lat);
                bounds.maxLat = Math.max(bounds.maxLat, lat);
                bounds.minLon = Math.min(bounds.minLon, lon);
                bounds.maxLon = Math.max(bounds.maxLon, lon);
            }

            return bounds;
        }

        function isPointInFlatPolygon(lat, lon, polygon) {
            let inside = false;

            for (let i = 0, j = polygon.length - 2; i < polygon.length; j = i, i += 2) {
                const latI = polygon[i];
                const lonI = polygon[i + 1];
                const latJ = polygon[j];
                const lonJ = polygon[j + 1];

                if (isPointOnSegment(lat, lon, latI, lonI, latJ, lonJ)) {
                    return true;
                }

                const intersects = (lonI > lon) !== (lonJ > lon) &&
                    lat < ((latJ - latI) * (lon - lonI)) / (lonJ - lonI) + latI;

                if (intersects) inside = !inside;
            }

            return inside;
        }

        function isPointOnSegment(lat, lon, latA, lonA, latB, lonB) {
            const tolerance = 1e-10;
            const cross = (lon - lonA) * (latB - latA) - (lat - latA) * (lonB - lonA);

            if (Math.abs(cross) > tolerance) return false;

            return lat >= Math.min(latA, latB) - tolerance &&
                   lat <= Math.max(latA, latB) + tolerance &&
                   lon >= Math.min(lonA, lonB) - tolerance &&
                   lon <= Math.max(lonA, lonB) + tolerance;
        }
    </script>
</body>
</html>
